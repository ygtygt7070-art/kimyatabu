<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tabu Oyunu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #4c1d95; /* Deep Purple Background */
            touch-action: pan-y; /* Prevent zooming on double tap */
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        /* Container for mobile app look */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh; /* For modern mobile browsers */
            background: linear-gradient(135deg, #6d28d9 0%, #4c1d95 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: white;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            animation: fadeIn 0.3s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card styling */
        .taboo-card {
            background: #ffffff;
            border: 2px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            color: #1f2937;
        }
        
        /* Disable text selection on game buttons */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        
        #info-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 50;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            backdrop-filter: blur(4px);
        }
        #info-modal.active {
            display: flex;
            animation: fadeIn 0.2s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. MAIN MENU SCREEN -->
        <div id="screen-main" class="screen active justify-center items-center p-6">
            <h1 class="text-7xl font-extrabold text-white tracking-tighter mb-4 drop-shadow-lg">TABU</h1>
            <p class="text-purple-200 mb-12 text-center text-lg">Arkadaşlarınızla eğlenceye hazır mısınız?</p>
            <button onclick="showScreen('screen-setup')" class="w-full max-w-xs bg-white text-purple-700 font-bold py-4 rounded-2xl shadow-xl active:scale-95 transition-transform text-2xl">
                Başlat
            </button>
        </div>

        <!-- 2. TEAM SETUP SCREEN -->
        <div id="screen-setup" class="screen justify-center p-6 bg-white text-gray-800 rounded-t-[3rem] mt-12 shadow-[0_-10px_40px_rgba(0,0,0,0.2)]">
            <h2 class="text-3xl font-extrabold text-center mb-8 text-purple-700">Oyun Ayarları</h2>
            
            <div class="space-y-5 w-full max-w-xs mx-auto mb-8">
                <div>
                    <label class="block text-sm font-bold text-gray-500 mb-1 uppercase tracking-wide">1. Takım İsmi</label>
                    <input type="text" id="team1-input" value="A Takımı" class="w-full px-4 py-3 border-2 border-purple-100 bg-purple-50 rounded-xl focus:border-purple-500 focus:outline-none text-lg font-bold text-purple-900 transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-500 mb-1 uppercase tracking-wide">2. Takım İsmi</label>
                    <input type="text" id="team2-input" value="B Takımı" class="w-full px-4 py-3 border-2 border-purple-100 bg-purple-50 rounded-xl focus:border-purple-500 focus:outline-none text-lg font-bold text-purple-900 transition-colors">
                </div>
                <div class="pt-2 border-t border-gray-100">
                    <label class="block text-sm font-bold text-gray-500 mb-1 uppercase tracking-wide">Kazanma Puanı</label>
                    <input type="number" id="win-score-input" value="50" min="1" class="w-full px-4 py-3 border-2 border-purple-100 bg-purple-50 rounded-xl focus:border-purple-500 focus:outline-none text-xl font-black text-purple-900 transition-colors text-center">
                </div>
            </div>

            <div class="flex justify-center mt-auto pb-4">
                <button onclick="initGame()" class="w-full max-w-xs bg-purple-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-purple-200 active:scale-95 transition-transform text-xl">
                    Oyuna Başla
                </button>
            </div>
        </div>

        <!-- 3. GAME SCREEN -->
        <div id="screen-game" class="screen flex-col h-full bg-transparent">
            <!-- Header (Timer and Score) -->
            <div class="flex justify-between items-center p-4 bg-purple-900/40 backdrop-blur-sm shadow-md shrink-0 border-b border-purple-500/30">
                <!-- Empty div to balance flex -->
                <div class="w-1/3"></div> 
                
                <!-- Timer -->
                <div class="w-1/3 flex justify-center">
                    <div class="bg-white text-purple-900 font-black text-3xl px-5 py-2 rounded-2xl flex items-center justify-center min-w-[80px] shadow-lg">
                        <span id="timer-display">30</span>
                    </div>
                </div>

                <!-- Current Team Score -->
                <div class="w-1/3 flex flex-col items-end text-right">
                    <span id="current-team-name" class="text-xs font-bold text-purple-200 uppercase tracking-widest">A Takımı</span>
                    <span id="current-team-score" class="text-2xl font-black text-white drop-shadow-md">0</span>
                </div>
            </div>

            <!-- Card Area -->
            <div class="flex-1 p-6 flex flex-col justify-center items-center overflow-y-auto relative">
                <div class="taboo-card w-full max-w-sm rounded-[2rem] p-6 flex flex-col items-center relative">
                    <!-- Info Icon -->
                    <button onclick="showInfo()" class="absolute top-4 right-4 bg-purple-100 text-purple-700 w-8 h-8 rounded-full font-bold flex items-center justify-center text-xl shadow-sm hover:bg-purple-200 active:scale-95 transition-all z-10">i</button>
                    
                    <div class="bg-purple-600 text-white w-full text-center py-5 rounded-2xl mb-6 shadow-inner border-b-4 border-purple-800 mt-4">
                        <h2 id="card-word" class="text-3xl font-black uppercase tracking-widest">KELİME</h2>
                    </div>
                    
                    <ul id="forbidden-words-list" class="w-full space-y-3 text-center">
                        <!-- Words will be injected here by JS -->
                    </ul>
                </div>
            </div>

            <!-- Info Modal -->
            <div id="info-modal">
                <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl relative text-gray-800">
                    <button onclick="hideInfo()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-700 font-bold text-xl w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 transition-colors">✕</button>
                    <h3 class="text-2xl font-black text-purple-700 mb-3 border-b pb-2">Konu Açıklaması</h3>
                    <p id="info-text" class="text-sm font-medium leading-relaxed max-h-[50vh] overflow-y-auto pr-2 text-gray-600"></p>
                </div>
            </div>

            <!-- Controls (Bottom Buttons) -->
            <div class="p-4 bg-purple-900/60 backdrop-blur-md shrink-0 pb-8 border-t border-purple-500/30">
                <div class="flex space-x-3 max-w-sm mx-auto h-24">
                    <button onclick="handleAction('tabu')" class="no-select flex-1 bg-red-500 text-white rounded-2xl font-black text-lg active:bg-red-700 active:scale-95 transition-all shadow-[0_4px_0_rgb(153,27,27)] active:shadow-[0_0px_0_rgb(153,27,27)] active:translate-y-1 flex flex-col items-center justify-center">
                        <span class="text-xl">Tabu</span>
                        <span class="text-xs opacity-90 font-semibold mt-1 bg-red-700 px-2 rounded-full">-1 Puan</span>
                    </button>
                    <button onclick="handleAction('pas')" id="btn-pas" class="no-select flex-1 bg-yellow-400 text-yellow-900 rounded-2xl font-black text-lg active:bg-yellow-500 active:scale-95 transition-all shadow-[0_4px_0_rgb(161,98,7)] active:shadow-[0_0px_0_rgb(161,98,7)] active:translate-y-1 flex flex-col items-center justify-center">
                        <span class="text-xl">Pas</span>
                        <span id="pas-count-display" class="text-xs opacity-90 font-bold mt-1 bg-yellow-500 px-2 rounded-full text-yellow-900">3 Hak</span>
                    </button>
                    <button onclick="handleAction('dogru')" class="no-select flex-1 bg-green-500 text-white rounded-2xl font-black text-lg active:bg-green-600 active:scale-95 transition-all shadow-[0_4px_0_rgb(22,101,52)] active:shadow-[0_0px_0_rgb(22,101,52)] active:translate-y-1 flex flex-col items-center justify-center">
                        <span class="text-xl">Doğru</span>
                        <span class="text-xs opacity-90 font-semibold mt-1 bg-green-700 px-2 rounded-full">+1 Puan</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 4. SCORE SCREEN -->
        <div id="screen-score" class="screen justify-center items-center p-6 bg-white text-gray-800 rounded-t-[3rem] mt-12 shadow-[0_-10px_40px_rgba(0,0,0,0.2)]">
            <h2 class="text-4xl font-black text-purple-700 mb-2">Tur Bitti!</h2>
            <p class="text-gray-500 mb-8 text-center font-semibold">İşte güncel durum:</p>
            
            <div class="w-full max-w-xs bg-purple-50 rounded-3xl shadow-inner overflow-hidden mb-8 border-2 border-purple-100">
                <!-- Team 1 Score Row -->
                <div class="flex justify-between items-center p-5 border-b-2 border-purple-100">
                    <span id="score-t1-name" class="font-bold text-xl text-gray-700">A Takımı</span>
                    <span id="score-t1-points" class="font-black text-3xl text-purple-600">0</span>
                </div>
                <!-- Team 2 Score Row -->
                <div class="flex justify-between items-center p-5">
                    <span id="score-t2-name" class="font-bold text-xl text-gray-700">B Takımı</span>
                    <span id="score-t2-points" class="font-black text-3xl text-purple-600">0</span>
                </div>
            </div>

            <div class="bg-purple-100 w-full max-w-xs rounded-2xl p-4 text-center mb-8">
                <p id="next-turn-info" class="font-semibold text-purple-600 uppercase text-sm tracking-wide">Sıradaki Takım</p>
                <p id="next-turn-team" class="text-2xl font-black text-purple-900 mt-1">B Takımı</p>
            </div>
            
            <div class="mt-auto pb-4 w-full flex justify-center">
                <button onclick="startNextTurn()" class="w-full max-w-xs bg-purple-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-purple-200 active:scale-95 transition-transform text-xl">
                    Devam Et
                </button>
            </div>
        </div>

        <!-- 5. VICTORY SCREEN -->
        <div id="screen-victory" class="screen justify-center items-center p-6 bg-gradient-to-b from-yellow-400 to-yellow-600 text-white relative">
            
            <!-- Decorative Confetti-like elements -->
            <div class="absolute top-10 left-10 text-4xl opacity-50 animate-bounce">✨</div>
            <div class="absolute bottom-40 right-10 text-4xl opacity-50 animate-bounce" style="animation-delay: 0.2s">🏆</div>
            <div class="absolute top-32 right-12 text-3xl opacity-50 animate-bounce" style="animation-delay: 0.4s">🎉</div>

            <h2 class="text-3xl font-bold mb-2 drop-shadow-md text-yellow-900">TEBRİKLER!</h2>
            <h1 id="winner-team-name" class="text-5xl font-black text-center mb-10 drop-shadow-xl uppercase">A TAKIMI</h1>
            <div class="bg-white/20 backdrop-blur-md rounded-3xl p-6 mb-12 border border-white/40 text-center">
                <p class="text-yellow-900 font-bold mb-1">KAZANDINIZ!</p>
                <p class="text-5xl font-black" id="winner-score-display">50 Puan</p>
            </div>
            
            <button onclick="resetToMenu()" class="w-full max-w-xs bg-white text-yellow-600 font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-transform text-xl mt-auto mb-4">
                Menüye Dön
            </button>
        </div>

    </div>

    <script>
        // Game Data (Chemistry Cards)
        const allCards = [
            { word: "Çözelti", forbidden: ["Homojen", "Karışım", "Çözücü", "Çözünürlük", "Tuzlu Su"], description: "Çözelti, iki veya daha fazla maddenin birbiri içerisinde atomik, iyonik veya moleküler düzeyde dağılarak oluşturduğu homojen karışımlardır. Çözeltide miktarı genellikle fazla olan ve dağılma ortamını sağlayan bileşene çözücü, bu ortam içerisinde dağılan bileşene ise çözünen adı verilir. Çözeltilerin belirli bir kimyasal formülü yoktur ve çözünen taneciklerinin boyutu 1 nanometreden küçüktür." },
            { word: "Alexander Fleming", forbidden: ["Penisilin", "Antibiyotik", "Bilim İnsanı", "İngiltere", "Keşif"], description: "Alexander Fleming, 1928 yılında küf mantarlarından elde ettiği ve bakteriyel enfeksiyonların tedavisinde çığır açan ilk antibiyotik olan penisilini keşfeden İskoç bakteriyologdur. Tıp ve kimya alanındaki bu buluşu sayesinde milyonlarca insanın hayatının kurtarılmasını sağlamış ve Nobel Tıp Ödülü'ne layık görülmüştür." },
            { word: "Tuz Ruhu", forbidden: ["Asit", "HCl", "Parlatıcı", "Turnusol", "pH"], description: "Tuz ruhu, kimyasal formülü HCl olan Hidrojen Klorür gazının sudaki çözeltisine verilen yaygın (geleneksel) addır. Kuvvetli bir asit özelliğine sahip olan bu madde, endüstride ve ev temizliğinde özellikle kireç ve pas giderici olarak kullanılır. Suda tamamen iyonlaşarak H+ iyonu verir ve cildi tahriş edici kuvvetli bir kimyasaldır." },
            { word: "Hidrojen", forbidden: ["Asit", "Element", "H", "Su", "Yakıcı"], description: "Hidrojen, periyodik sistemin 1. periyot 1A grubunda yer alan, sembolü H ve atom numarası 1 olan en hafif elementtir. Evrende en çok bulunan element olmasına rağmen doğada genellikle H₂ şeklinde iki atomlu gaz molekülleri halinde bulunur. Ametal yapılıdır ve oksijenle tepkimeye girdiğinde su (H₂O) bileşiğini oluşturur." },
            { word: "Beherglas", forbidden: ["Bardak", "Cam", "Laboratuvar", "Sıvı", "Ölçüm"], description: "Beherglas, kimya laboratuvarlarında sıvıların karıştırılması, ısıtılması, aktarılması ve çözelti hazırlanmasında sıkça kullanılan silindir biçimli cam malzemedir. Ağız kısmında sıvının dökülmesini kolaylaştıran bir oluk ve üzerinde yaklaşık hacim değerlerini gösteren derecelendirme çizgileri bulunur." },
            { word: "Simya", forbidden: ["Dönüştürme", "Ölümsüzlük", "Felsefe Taşı", "Altın", "Madde"], description: "Simya (Alşimi), değersiz madenleri altına çevirme ve ölümsüzlük iksirini (ab-ı hayat) bulma amacı güden teorik temellere dayanmayan çalışmalardır. Sistematik bilgi birikimi içermemesi, deneysel sonuçların teorilere dayanmaması ve sınama-yanılma yöntemine bağlı olması nedeniyle bilim kabul edilmez; ancak kimya bilimine zemin hazırlamıştır." },
            { word: "Amonyak", forbidden: ["Gaz", "Temizlik", "Keskin", "Acar", "NH3"], description: "Amonyak, azot ve hidrojen atomlarının kovalent bağ yapmasıyla oluşan, formülü NH₃ olan renksiz ve keskin kokulu bir bileşiktir. Yapısında OH⁻ iyonu bulundurmamasına rağmen suda çözündüğünde ortama OH⁻ iyonu verdiği için zayıf bir baz özelliği gösterir ve temizlik malzemeleri ile gübre üretiminde yoğun olarak kullanılır." },
            { word: "Sodyum", forbidden: ["Tuz", "Yanıcı", "Kaşık", "NaCl", "Su"], description: "Sodyum, periyodik cetvelin 3. periyot 1A grubunda yer alan, sembolü Na olan son derece aktif bir alkali metaldir. Bıçakla kesilebilecek kadar yumuşak olan bu metal, su ve hava ile şiddetli tepkime verdiğinden doğada serbest halde bulunmaz; genellikle yemek tuzu (NaCl) gibi bileşiklerin yapısında yer alır." },
            { word: "Ametal", forbidden: ["Gaz", "Mat", "Valans", "Periyodik Cetvel", "Sağ"], description: "Ametaller, periyodik tablonun genellikle sağ tarafında bulunan, ısı ve elektriği iletmeyen (grafit hariç), mat görünümlü elementlerdir. Oksitleri genellikle asidik özellik gösterir. Kendi aralarında kovalent, metallerle ise iyonik bağlı bileşikler oluştururlar ve oda koşullarında katı, sıvı veya gaz halinde bulunabilirler." },
            { word: "Proton", forbidden: ["Artı Yük", "Çekirdek", "Atom", "Nötron", "Elektron"], description: "Proton, atomun çekirdeğinde yer alan ve pozitif (+1) elektrik yüküne sahip temel alt taneciktir. Bir atomun çekirdeğindeki proton sayısı o atomun kimliğini belirler ve bu sayıya 'atom numarası' denir. Nötr bir atomda proton sayısı, çekirdek etrafındaki elektron sayısına eşittir." },
            { word: "Erlenmayer", forbidden: ["Titrasyon", "Çözelti", "Cam", "Saklama", "Üçgen"], description: "Erlenmayer, tabanı geniş, boyun kısmı dar ve koni şeklinde olan cam bir laboratuvar malzemesidir. Dar boyun yapısı sayesinde içerisindeki çözeltilerin dökülmeden ve çalkalanarak karıştırılmasına olanak tanır. Özellikle titrasyon deneylerinde ve sıvı çözeltilerin saklanmasında tercih edilir." },
            { word: "Nötron", forbidden: ["Yüksüz", "Proton", "Atom", "Elektron", "Çekirdek"], description: "Nötron, atom çekirdeğinde protonlarla birlikte bulunan, elektrik yükü olmayan (yüksüz) temel alt taneciktir. Kütlesi protonun kütlesine yaklaşık olarak eşittir. Bir atomun proton ve nötron sayılarının toplamı o atomun kütle numarasını (nükleon sayısını) oluşturur." },
            { word: "Element", forbidden: ["Tek Cins Atom", "Saf Madde", "Periyodik Tablo", "Sembol", "Bileşik"], description: "Element, aynı tür atomlardan oluşan, fiziksel veya kimyasal yöntemlerle daha basit maddelere ayrılamayan saf maddelerdir. Sembollerle gösterilirler, belirli erime ve kaynama noktalarına sahiptirler ve periyodik sistem üzerinde özelliklerine göre gruplandırılırlar." },
            { word: "Büret", forbidden: ["Dereceli", "Tespit Etmek", "Titrasyon", "Cam", "Boru"], description: "Büret, alt kısmında akışı hassas şekilde kontrol etmeye yarayan bir musluk bulunan, derecelendirilmiş uzun cam borudur. Analitik kimyada, özellikle titrasyon işlemlerinde harcanan sıvı hacmini mililitre hassasiyetinde ölçmek için kullanılır." },
            { word: "Turnusol Kağıdı", forbidden: ["pH", "Asit", "Baz", "Renk", "Test"], description: "Turnusol kağıdı, çözeltilerin asidik mi yoksa bazik mi olduğunu belirlemek amacıyla kullanılan en yaygın indikatördür (belirteç). Asidik ortamlarda mavi turnusol kağıdı kırmızı renge dönerken, bazik ortamlarda kırmızı turnusol kağıdı mavi renge dönüşür." },
            { word: "Bileşik", forbidden: ["Formül", "Saf Madde", "İki Veya Daha Fazla", "Element", "Karışım"], description: "Bileşik, iki ya da daha fazla farklı element atomunun belirli sabit kütle oranlarında kimyasal bağlarla birleşerek oluşturduğu saf maddelerdir. Bileşikler kendilerini oluşturan elementlerin özelliklerini göstermezler, formüllerle temsil edilirler ve ancak kimyasal yöntemlerle bileşenlerine ayrıştırılabilirler." },
            { word: "Laboratuvar", forbidden: ["Deney", "Önlük", "Kimyager", "Tüp", "Malzeme"], description: "Laboratuvar, bilimsel araştırmaların, analizlerin ve kontrollü deneylerin gerçekleştirildiği, özel güvenlik ekipmanları ile hassas ölçüm araçlarını barındıran çalışma alanıdır. Kimya laboratuvarlarında deneylerin güvenli yapılabilmesi için önlük, gözlük ve havalandırma sistemleri standart olarak bulunur." },
            { word: "Helyum", forbidden: ["Element", "Balon", "Uçmak", "Soygaz", "Evren"], description: "Helyum, periyodik sistemin 8A grubunda yer alan, sembolü He ve atom numarası 2 olan bir soygazdır. Son katmanında 2 elektron barındırmasına rağmen kararlı yapıda olduğundan kimyasal tepkimelere girme isteği yok denecek kadar azdır. Havadan hafif ve yanıcı olmayan bir gazdır." },
            { word: "Periyodik Sistem", forbidden: ["Mendeleyev", "Grup", "Periyot", "Element", "Tablo"], description: "Periyodik sistem, bilinen tüm elementlerin artan atom numaralarına (proton sayılarına) göre yatay sıralar (periyot) ve dikey sütunlar (grup) şeklinde düzenlendiği çizelgedir. Henry Moseley'in katkılarıyla son şeklini alan bu tabloda benzer kimyasal özellik gösteren elementler aynı grupta toplanır." },
            { word: "Nötralleşme Tepkimesi", forbidden: ["Asit", "Baz", "Nötr", "Tuz", "Su"], description: "Nötralleşme tepkimesi, bir asidin çözeltisindeki H⁺ iyonları ile bir bazın çözeltisindeki OH⁻ iyonlarının birleşerek su (H₂O) ve tuz oluşturması sürecidir. Bu tepkimelerde net iyon denklemi her zaman H⁺(suda) + OH⁻(suda) → H₂O(sıvı) şeklindedir ve egzotermik (ısı veren) bir süreçtir." },
            { word: "Metal", forbidden: ["İletken", "Parlak", "Tel", "Paket", "Periyodik Cetvel"], description: "Metaller, periyodik tablonun sol ve orta kısmında yer alan, yüzeyleri parlak, tel ve levha haline getirilebilen (işlenebilen) ve elektrik ile ısıyı çok iyi ileten elementlerdir. Oda sıcaklığında cıva hariç tamamı katı halde bulunur ve bileşik oluştururken sadece elektron vererek pozitif yüklü iyon (katyon) olurlar." },
            { word: "Baget", forbidden: ["Karıştırma", "Cam", "İletken", "Plastik", "Çözelti"], description: "Baget, kimya laboratuvarlarında sıvı karışımların veya çözeltilerin homojen şekilde karıştırılmasını sağlamak amacıyla kullanılan çubuk şeklindeki sert cam malzemedir. Kimyasal maddelere karşı dirençli olduğu için çözelti hazırlama süreçlerinde yaygın olarak kullanılır." },
            { word: "Karışım", forbidden: ["Homojen", "Heterojen", "Fiziksel", "Ayırma", "Çözelti"], description: "Karışım, iki veya daha fazla maddenin kimyasal kimliklerini kaybetmeden, istenilen oranlarda fiziksel olarak bir araya gelmesiyle oluşan maddelerdir. Karışımlar saf değildir, belirli bir sembol veya formülleri yoktur ve bileşenlerine fiziksel yöntemlerle (süzme, damıtma vb.) ayrıştırılabilirler." },
            { word: "Soygaz", forbidden: ["Helyum", "Kararlı", "8A", "Periyodik Cetvel", "Son Katman"], description: "Soygazlar (asal gazlar), periyodik tablonun 8A grubunda yer alan, son elektron katmanları tam dolu olduğu için kararlı karaktere sahip olan element grubudur. Oda koşullarında tek atomlu (monoatomik) gaz halinde bulunurlar ve doğal şartlarda elektron alışverişi veya paylaşımı yapmazlar." },
            { word: "Atom", forbidden: ["Çekirdek", "Proton", "Nötron", "Elektron", "Parçacık"], description: "Atom, bir elementin tüm fiziksel ve kimyasal özelliklerini taşıyan en küçük yapı taşıdır. Merkezinde proton ve nötron barındıran yoğun bir çekirdek ile çekirdek etrafındaki katmanlarda hareket eden negatif yüklü elektronlardan oluşur." },
            { word: "Su", forbidden: ["Sıvı", "H2O", "İçmek", "Oksijen", "Buharlaşma"], description: "Su, iki hidrojen ve bir oksijen atomunun kovalent bağ yapmasıyla meydana gelen (H₂O), polar yapılı ve saf bir bileşiktir. Standart şartlarda renksiz ve kokusuzdur; canlı organizmaların biyokimyasal reaksiyonlarını gerçekleştirebilmesi için temel çözücü ortamı oluşturur." },
            { word: "Termometre", forbidden: ["Sıcaklık", "Sıvılı", "Cıva", "Derece", "Ölçüm"], description: "Termometre, maddelerin ortalama kinetik enerjisinin bir göstergesi olan sıcaklığı ölçmek için kullanılan cihazdır. Sıvılı termometreler, haznelerindeki sıvının (genellikle alkol veya cıva) sıcaklıkla genleşmesi ve kılcal boruda yükselmesi prensibine göre çalışır." },
            { word: "Baz", forbidden: ["Sabun", "Kaygan", "Asit", "pH", "Arındırıcı"], description: "Bazlar, suda çözündüklerinde ortama OH⁻ (hidroksit) iyonu veren, tatları acı olan ve ele kayganlık hissedilmesi sağlayan maddelerdir. 25 °C sıcaklıktaki sulu çözeltilerinde pH değeri 7 ile 14 arasındadır. Kırmızı turnusol kağıdını maviye çevirirler ve asitlerle nötralleşme tepkimesi verirler." },
            { word: "Asit", forbidden: ["Limon", "Baz", "pH", "Ekşi", "Aşındırıcı"], description: "Asitler, sulu çözeltilerine H⁺ (veya H₃O⁺) iyonu bırakan, tatları ekşi ve aşındırıcı (korozif) özellikteki maddelerdir. 25 °C'de pH değerleri 0 ile 7 arasındadır. Mavi turnusol kağıdını kırmızıya dönüştürürler ve aktif metallerle tepkimeye girerek H₂ gazı açığa çıkarırlar." }
        ];

        // Game State
        let state = {
            team1: { name: "A Takımı", score: 0 },
            team2: { name: "B Takımı", score: 0 },
            winningScore: 50,
            currentTurn: 1, // 1 for Team 1, 2 for Team 2
            timeLeft: 30,
            passesLeft: 3,
            timerId: null,
            currentCardInfo: null,
            availableCards: []
        };

        // Utility: Shuffle Array (Fisher-Yates)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Utility: Show Specific Screen
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Initialize Game from Setup Screen
        function initGame() {
            // Get Inputs
            let t1Input = document.getElementById('team1-input').value.trim();
            let t2Input = document.getElementById('team2-input').value.trim();
            let winScoreInput = parseInt(document.getElementById('win-score-input').value);
            
            state.team1.name = t1Input || "A Takımı";
            state.team2.name = t2Input || "B Takımı";
            state.winningScore = isNaN(winScoreInput) || winScoreInput < 1 ? 50 : winScoreInput;
            
            // Reset Game Data
            state.team1.score = 0;
            state.team2.score = 0;
            state.currentTurn = 1;
            
            // Initialize and shuffle the deck
            state.availableCards = [...allCards];
            shuffleArray(state.availableCards);
            
            startTurn();
        }

        // Start a Turn for the current team
        function startTurn() {
            state.timeLeft = 30;
            state.passesLeft = 3;
            
            // Update UI for the turn
            updateHeaderUI();
            updatePasButtonUI();
            loadRandomCard();
            
            showScreen('screen-game');
            
            // Start Timer
            clearInterval(state.timerId);
            state.timerId = setInterval(timerTick, 1000);
        }

        function timerTick() {
            state.timeLeft--;
            document.getElementById('timer-display').innerText = state.timeLeft;
            
            if (state.timeLeft <= 0) {
                endTurn();
            }
        }

        // End Turn when time is up
        function endTurn() {
            clearInterval(state.timerId);
            
            // Check for Victory
            if (state.team1.score >= state.winningScore || state.team2.score >= state.winningScore) {
                let winnerName = "";
                let winnerScore = 0;
                
                if (state.team1.score > state.team2.score) {
                    winnerName = state.team1.name;
                    winnerScore = state.team1.score;
                } else if (state.team2.score > state.team1.score) {
                    winnerName = state.team2.name;
                    winnerScore = state.team2.score;
                } else {
                    winnerName = "BERABERE!";
                    winnerScore = state.team1.score;
                }

                document.getElementById('winner-team-name').innerText = winnerName;
                document.getElementById('winner-score-display').innerText = winnerScore + " Puan";
                showScreen('screen-victory');
                return;
            }

            // Populate Score Screen if no victory
            document.getElementById('score-t1-name').innerText = state.team1.name;
            document.getElementById('score-t1-points').innerText = state.team1.score;
            document.getElementById('score-t2-name').innerText = state.team2.name;
            document.getElementById('score-t2-points').innerText = state.team2.score;
            
            // Determine Next Team
            let nextTeamName = state.currentTurn === 1 ? state.team2.name : state.team1.name;
            document.getElementById('next-turn-team').innerText = nextTeamName;
            
            showScreen('screen-score');
        }

        function startNextTurn() {
            // Switch turns
            state.currentTurn = state.currentTurn === 1 ? 2 : 1;
            startTurn();
        }

        // Reset to Main Menu
        function resetToMenu() {
            showScreen('screen-main');
        }

        // Load a random card into the UI
        function loadRandomCard() {
            // Refill deck if all cards have been played
            if (state.availableCards.length === 0) {
                state.availableCards = [...allCards];
                shuffleArray(state.availableCards);
            }
            
            // Draw a card from the deck
            state.currentCardInfo = state.availableCards.pop();
            
            document.getElementById('card-word').innerText = state.currentCardInfo.word;
            document.getElementById('info-text').innerText = state.currentCardInfo.description;
            
            const listEl = document.getElementById('forbidden-words-list');
            listEl.innerHTML = '';
            
            state.currentCardInfo.forbidden.forEach(word => {
                const li = document.createElement('li');
                li.className = "text-xl font-bold text-gray-600 py-1 border-b border-gray-100 last:border-0";
                li.innerText = word;
                listEl.appendChild(li);
            });
        }
        
        // Modal Functions
        function showInfo() {
            document.getElementById('info-modal').classList.add('active');
        }
        
        function hideInfo() {
            document.getElementById('info-modal').classList.remove('active');
        }

        // Update Header (Team name and score)
        function updateHeaderUI() {
            const currentTeam = state.currentTurn === 1 ? state.team1 : state.team2;
            document.getElementById('current-team-name').innerText = currentTeam.name;
            document.getElementById('current-team-score').innerText = currentTeam.score;
            document.getElementById('timer-display').innerText = state.timeLeft;
        }

        // Update Pass Button state
        function updatePasButtonUI() {
            const btn = document.getElementById('btn-pas');
            const display = document.getElementById('pas-count-display');
            
            display.innerText = state.passesLeft + " Hak";
            
            if (state.passesLeft <= 0) {
                btn.classList.add('opacity-50', 'pointer-events-none');
                btn.classList.remove('active:scale-95', 'active:translate-y-1');
            } else {
                btn.classList.remove('opacity-50', 'pointer-events-none');
                btn.classList.add('active:scale-95', 'active:translate-y-1');
            }
        }

        // Handle button clicks (Doğru, Tabu, Pas)
        function handleAction(action) {
            const currentTeam = state.currentTurn === 1 ? state.team1 : state.team2;
            
            if (action === 'dogru') {
                currentTeam.score += 1;
                loadRandomCard();
            } 
            else if (action === 'tabu') {
                currentTeam.score -= 1;
                loadRandomCard();
            } 
            else if (action === 'pas') {
                if (state.passesLeft > 0) {
                    state.passesLeft -= 1;
                    loadRandomCard();
                }
            }
            
            // Update UI immediately after score/pass changes
            updateHeaderUI();
            updatePasButtonUI();
        }
    </script>
</body>
</html>
